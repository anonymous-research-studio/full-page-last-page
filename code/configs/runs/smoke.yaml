# Harness check with scripted models: every form, every extent, all arms. No API calls.
name: smoke
models: [scripted-follow, scripted-never, scripted-if-full, scripted-signal]
signal_forms: [none, has_more, next_cursor, total_count, link_header, page_info,
               nl_note, nl_note_json, placeholder_row, cursor_plus_note]
extents: [more_full, last_full, last_short, more_short]
task_need: [needs_all, page1_sufficient]
items_per_cell: 8
page_limit: 20
max_tool_calls: 12
default_placement: bottom
seed: 0
arms:
  placement: {base_form: has_more, levels: [top, bottom]}
  documentation: {base_form: has_more, levels: [documented, undocumented]}
  limit: {base_form: none, levels: [stated, unstated]}
  phrasing: {base_form: none, levels: [neutral, explicit], task_need: [needs_all]}
  answer_format: {base_forms: [none], levels: [final_line, completeness]}   # no signal: where answers go incomplete
  # False signals on page 1, as from a buggy API: four ways of saying "done" while more rows exist,
  # and "more" on a true last page. Crossed with the answer format, so the completeness field is
  # tested where incomplete answers occur.
  conflict:
    levels: [false_end, false_end_cursor, false_total, false_note, false_more]
    task_need: [needs_all]
    answer_formats: [final_line, completeness]
