[project]
name = "fplp"
version = "0.1.0"
description = "Which completeness signals in Web API responses do LLM agents act on?"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["llm-agents", "web-apis", "pagination", "tool-use", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Author metadata is added at camera-ready; review is double-blind.
dependencies = [
    "pyyaml>=6",
    "pandas>=2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
providers = ["anthropic>=0.70", "openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fplp = "fplp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned here so linting does not depend on the installed ruff version's defaults.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "PIE", "PERF", "RUF", "ISC", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
